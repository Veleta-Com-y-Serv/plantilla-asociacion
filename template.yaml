# Metadatos de la plantilla para el catálogo de NoExpertise.
id: asociacion
nombre: Asociación / club
descripcion: Web cercana para asociaciones, clubes y ONG, con actividades, noticias y alta de socios.
sectores: [asociacion, club, ong]
secciones: [hero, actividades, hazte-socio, noticias, equipo, contacto]
estilo: cercano
plan_minimo: gratis
version: 1.3.0
base: astrowind
demo_url: https://demo-plantilla-asociacion.noexpertise.com
activa: true
orden: 60

# Asistente de puesta en marcha (NoExpertise): un paso por pantalla. Rutas del site sin índices;
# tipos: texto y lista (la IA propone), datos, fotos, eleccion (colores y logo) y repaso.
asistente:
  - id: negocio
    titulo: "Tu asociación"
    pregunta: "¿Cómo se llama vuestra asociación o club y qué hacéis?"
    ayuda: "A qué os dedicáis, dónde y quién puede participar."
    tipo: texto
    campos: [nombre, eslogan, secciones.hero.antetitulo, secciones.hero.titulo, secciones.hero.texto, secciones.hero.titulo_destacado, secciones.hero.items, seo.descripcion]
  - id: contacto
    titulo: "Cómo te encuentran"
    pregunta: "¿Dónde estáis y cómo os pueden llamar o escribir?"
    ayuda: "Solo lo que quieras que vean tus clientes. Lo que dejes vacío no sale en tu web."
    tipo: datos
    campos: [contacto.telefono, contacto.whatsapp, contacto.email, contacto.direccion, contacto.horario, redes.instagram, redes.facebook]
  - id: actividades
    titulo: "Actividades"
    pregunta: "¿Qué actividades organizáis? Una por línea, con cuándo si quieres."
    tipo: texto
    campos: [secciones.actividades.titulo, secciones.actividades.texto, secciones.actividades.items]
  - id: hazte-socio
    titulo: "Hazte socio"
    pregunta: "¿Cómo se hace alguien socio, qué ventajas tiene y cuánto cuesta?"
    tipo: texto
    campos: [secciones.hazte-socio.titulo, secciones.hazte-socio.texto, secciones.hazte-socio.items, secciones.hazte-socio.cuota.precio, secciones.hazte-socio.cuota.periodo, secciones.hazte-socio.cuota.nota]
  - id: noticias
    titulo: "Noticias"
    pregunta: "¿Tenéis alguna novedad que contar? Una por línea, con la fecha."
    ayuda: "Si ahora no tenéis, salta este paso."
    tipo: lista
    campos: [secciones.noticias.noticias]
  - id: equipo
    titulo: "Junta y equipo"
    pregunta: "¿Quién forma el equipo? Nombre y qué hace cada uno, uno por línea."
    ayuda: "Las fotos las pones luego en Contenido."
    tipo: lista
    campos: [secciones.equipo.personas]
  - id: fotos
    titulo: "Tus fotos"
    pregunta: "Pon una foto de portada y, si quieres, alguna más."
    ayuda: "Sube las tuyas o elige una del banco. Las que no cambies se quedan como están."
    tipo: fotos
    campos: [secciones.hero.imagen, secciones.hero.galeria]
  - id: aspecto
    titulo: "Colores y logo"
    pregunta: "Elige los colores de tu web y, si tienes, tu logo."
    tipo: eleccion
    campos: [colores.primario, colores.acento, logo]
  - id: repaso
    titulo: "Repaso"
    tipo: repaso
