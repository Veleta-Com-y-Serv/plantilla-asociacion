secciones:
  hero:
    activa: true
    antetitulo: Desde 1972 en Jaca
    titulo: Sal al monte
    titulo_destacado: en buena compañía.   # parte del titular subrayada
    texto: "Salidas cada fin de semana, escuela de escalada y actividades para todas las edades. Ven a conocernos."
    imagen: /fotos/hero.jpg
    galeria: [/fotos/galeria-2.jpg]   # segunda foto del collage
    cta: { texto: Hazte socio, url: "/#hazte-socio" }
    cta_secundario: { texto: Próximas salidas, url: "/#actividades" }
    items:
      - { titulo: "640", texto: socios, icono: usuarios }
      - { titulo: "50", texto: salidas al año, icono: montana }
      - { titulo: "53", texto: años de club, icono: corazon }

  actividades:
    activa: true
    antetitulo: Actividades
    titulo: Qué hacemos
    texto: "Organizadas por socios voluntarios. Todas las salidas tienen un responsable con formación."
    items:
      - { titulo: Salidas de montaña, texto: "Rutas de dificultad variada cada sábado o domingo por el Pirineo.", icono: montana, cuando: Fines de semana }
      - { titulo: Escuela de escalada, texto: "Cursos de iniciación y perfeccionamiento en el rocódromo y en roca.", icono: escudo, cuando: Martes y jueves }
      - { titulo: Esquí de travesía, texto: "Salidas y curso de seguridad en avalanchas con guía titulado.", icono: sol, cuando: Diciembre – abril }
      - { titulo: Montaña en familia, texto: "Excursiones cortas pensadas para ir con niños desde 4 años.", icono: nino, cuando: Un domingo al mes }
      - { titulo: Bici de montaña, texto: "Rutas por la Jacetania y el Camino de Santiago.", icono: bici, cuando: Primavera y otoño }
      - { titulo: Biblioteca y charlas, texto: "Más de 900 guías y mapas, y proyecciones en la sede.", icono: calendario, cuando: Viernes }

  hazte-socio:
    activa: true
    antetitulo: Hazte socio
    titulo: Únete al club
    texto: "Tu cuota mantiene las actividades, la escuela y el refugio. Y te da ventajas desde el primer día."
    items:
      - { titulo: Seguro federativo, texto: Con la licencia de la FAM. }
      - { titulo: Descuentos, texto: En tiendas de montaña de Jaca. }
      - { titulo: Cursos a precio de socio, texto: "Escalada, nieve y orientación." }
      - { titulo: Préstamo de material, texto: "Crampones, piolets y ARVA." }
    cuota: { precio: "35 €", periodo: año, nota: "Menores de 18 años y familias numerosas: 15 €." }
    cta: { texto: Quiero hacerme socio, url: "/#contacto" }

  noticias:
    activa: true
    antetitulo: Noticias
    titulo: Lo último del club
    noticias:
      - { fecha: 12 oct 2026, titulo: Abiertas las inscripciones del curso de esquí de travesía, texto: "Plazas limitadas a 16 personas. Empieza el 9 de enero." }
      - { fecha: 28 sep 2026, titulo: "Crónica: travesía Respomuso – Balaitús", texto: "Veinte socios en dos días espectaculares de alta montaña." }
      - { fecha: 15 sep 2026, titulo: Nueva sede para la biblioteca, texto: "Ampliamos la sala con donaciones de los socios fundadores." }

  equipo:
    activa: true
    antetitulo: La junta
    titulo: Quién organiza todo esto
    texto: "Socios voluntarios elegidos en asamblea cada cuatro años."
    personas:
      - { nombre: Rosa Lacasta, cargo: Presidenta, foto: /fotos/persona-1.jpg }
      - { nombre: Alberto Pueyo, cargo: Vicepresidente, foto: /fotos/persona-2.jpg }
      - { nombre: Inés Marco, cargo: Secretaria, foto: /fotos/persona-3.jpg }
      - { nombre: Jorge Abad, cargo: Tesorero, foto: /fotos/persona-4.jpg }
      - { nombre: Teresa Ara, cargo: Vocal de escuela, foto: /fotos/persona-5.jpg }

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Lo que nos preguntan antes de apuntarse
    preguntas:
      - { pregunta: "¿Qué nivel necesito para venir a las salidas?", respuesta: "Ninguno para empezar. Cada salida indica su dificultad y tenemos cursos de iniciación y actividades en familia." }
      - { pregunta: "¿Hay que ser socio para participar?", respuesta: "En la mayoría de actividades, sí, porque el seguro va con la licencia federativa. Pregúntanos y te contamos cómo probar antes de apuntarte." }
      - { pregunta: "¿Cuánto cuesta la cuota?", respuesta: "Depende de la edad y de la licencia que elijas. Te lo explicamos en la sede o por correo, sin compromiso." }
      - { pregunta: "¿Prestáis material?", respuesta: "Sí, a los socios: crampones, piolets y ARVA. Se reserva en la sede los martes y jueves por la tarde." }
      - { pregunta: "¿Pueden venir niños?", respuesta: "Sí. Un domingo al mes hacemos excursiones cortas pensadas para ir con niños desde 4 años." }

  contacto:
    activa: true
    antetitulo: Contacto
    titulo: Pásate por la sede
    texto: "Escríbenos o ven un martes o jueves por la tarde. Te contamos todo con un café."
