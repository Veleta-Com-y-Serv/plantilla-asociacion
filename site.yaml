      - { pregunta: "¿Qué nivel necesito para venir a las salidas?", respuesta: "Ninguno para empezar. Cada salida indica su dificultad y tenemos cursos de iniciación y actividades en familia." }
      - { pregunta: "¿Hay que ser socio para participar?", respuesta: "En la mayoría de actividades, sí, porque el seguro va con la licencia federativa. Pregúntanos y te contamos cómo probar antes de apuntarte." }
      - { pregunta: "¿Cuánto cuesta la cuota?", respuesta: "Depende de la edad y de la licencia que elijas. Te lo explicamos en la sede o por correo, sin compromiso." }
      - { pregunta: "¿Prestáis material?", respuesta: "Sí, a los socios: crampones, piolets y ARVA. Se reserva en la sede los martes y jueves por la tarde." }
      - { pregunta: "¿Pueden venir niños?", respuesta: "Sí. Un domingo al mes hacemos excursiones cortas pensadas para ir con niños desde 4 años." }

